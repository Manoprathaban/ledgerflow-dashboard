name: CI and deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy the backend to Render (scaffold only until implementation is ready)
        type: boolean
        required: true
        default: false
      deploy_frontend:
        description: Deploy the mock-data frontend to Vercel
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ledger-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend lint, typing, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  frontend:
    name: Frontend lint, typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  migration:
    name: Validate Supabase migration on PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply migration to clean database
        env:
          PGPASSWORD: ledger
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U ledger -d ledger \
              -v ON_ERROR_STOP=1 \
              -f "$migration"
          done
      - name: Verify database constraints and triggers
        env:
          PGPASSWORD: ledger
        run: |
          psql -h localhost -U ledger -d ledger \
            -v ON_ERROR_STOP=1 \
            -f backend/tests/sql/verify_schema.sql
      - name: Check Supabase RLS and backend-only policies
        env:
          PGPASSWORD: ledger
        run: |
          psql -h localhost -U ledger -d ledger -v ON_ERROR_STOP=1 -c \
            "SELECT 1 / CASE WHEN bool_and(relrowsecurity) AND (SELECT COUNT(*) FROM pg_policies WHERE schemaname = 'public' AND tablename IN ('accounts', 'transactions') AND policyname IN ('accounts_backend_access', 'accounts_backend_only', 'transactions_backend_access', 'transactions_backend_only')) = 4 THEN 1 ELSE 0 END FROM pg_class WHERE oid IN ('public.accounts'::regclass, 'public.transactions'::regclass)"

  deploy_database:
    name: Apply Supabase migrations
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.SUPABASE_MIGRATIONS_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch'
      && (inputs.deploy_backend || inputs.deploy_frontend))
    needs:
      - backend
      - frontend
      - migration
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Link Supabase project
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
      - name: Preview pending migrations
        run: supabase db push --linked --dry-run
      - name: Apply pending migrations
        run: supabase db push --linked

  deploy_backend:
    name: Trigger Render deployment
    if: >-
      needs.deploy_database.result == 'success'
      && ((github.event_name == 'push' && vars.RENDER_DEPLOY_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_backend))
    needs:
      - deploy_database
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy_frontend:
    name: Deploy frontend to Vercel
    if: >-
      needs.deploy_database.result == 'success'
      && ((github.event_name == 'push' && vars.VERCEL_DEPLOY_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend))
    needs:
      - deploy_database
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm install --global vercel@41.7.2
      - name: Install frontend dependencies
        run: npm ci
      - name: Pull Vercel project configuration
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build and deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
